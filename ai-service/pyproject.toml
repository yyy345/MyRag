[project]
name = "ai-library-ai-service"
version = "0.1.0"
description = "Internal AI API and indexing worker migration scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "python-multipart>=0.0.18,<1",
    "pypdf>=6,<7",
    "mammoth>=1.9,<2",
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7,<1",
    "langchain-openai==1.6.3",
    "pillow>=11,<13",
    "langchain-text-splitters>=1,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "aio-pika>=9.5,<10",
    "pgvector>=0.4,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

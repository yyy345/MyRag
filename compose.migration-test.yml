name: ai-library-migration-test
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: migration-test-only
      POSTGRES_DB: migration_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d migration_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56380:6379"]
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["127.0.0.1:55673:5672"]
